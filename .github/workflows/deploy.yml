name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages.
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
on:
  push:
    branches: ["claude/cod-zombies-game-design-IaJt5", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Set repo variable VITE_SERVER_URL (Settings → Secrets and variables →
      # Actions → Variables) to your deployed wss:// server for online co-op.
      # Left unset, the build still works for solo play.
      - run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
